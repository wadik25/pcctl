[package]
name = "pcctl-desktop"
version = "0.1.0"
description = "pcctl Aufgaben-Inbox"
authors = ["wadik"]
edition = "2021"

[lib]
name = "pcctl_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
