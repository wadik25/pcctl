# Das Android Gradle Plugin läuft nicht auf OpenJDK 25. Ist das System-Java
# zu neu, hier den absoluten Pfad zu einem JDK 21 eintragen (Gradle löst
# $HOME in dieser Datei nicht auf) – am System-Java wird nichts geändert.
# org.gradle.java.home=/pfad/zu/jdk-21

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
